name: Codebase checks
on: [push, pull_request]

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -r requirements-dev.txt -c requirements-lock.txt
          python -m pip check
      - run: python -m ruff check .
      - name: Validate independent synthetic fixtures
        run: python -X utf8 tools/build_catalogs.py --check --root tests/support/fixtures/catalogs
      - name: Validate the retained metadata sample
        run: python -X utf8 tools/build_catalogs.py --check
      - name: Offline unit and metadata tests
        run: python -m pytest -q -m "not postgres and not hus_postgres and not full_catalog_acceptance" --junitxml=reports/pytest-offline.xml
      - name: Prerequisite tests use stable hash ordering
        run: |
          env PYTHONHASHSEED=1 python -m pytest -q tests/database/source/test_reviewed_prerequisites.py::test_optimization_requires_every_own_major_prerequisite
          env PYTHONHASHSEED=2 python -m pytest -q tests/database/source/test_reviewed_prerequisites.py::test_optimization_requires_every_own_major_prerequisite
      - name: Upload offline test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-offline
          path: reports/pytest-offline.xml
          if-no-files-found: warn
      - name: Build pinned HUS candidate corpus offline
        run: python -X utf8 -m tools.prepare_hus_corpus build --out "${{ runner.temp }}/hus-corpus-candidate"
      - name: Verify byte-identical HUS corpus reproduction
        run: python -X utf8 -m tools.prepare_hus_corpus verify --out "${{ runner.temp }}/hus-corpus-candidate"
      - name: Keep HUS candidate build evidence
        uses: actions/upload-artifact@v4
        with:
          name: hus-corpus-candidate
          path: ${{ runner.temp }}/hus-corpus-candidate
          if-no-files-found: error
          retention-days: 14
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: se_project_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d se_project_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://test_user:ci_test_only@127.0.0.1:5432/se_project_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -r requirements-dev.txt -c requirements-lock.txt
          python -m pip check
      - name: PostgreSQL round trips in isolated schemas using synthetic fixtures
        run: python -m pytest -q -m postgres --junitxml=reports/pytest-postgres.xml
      - name: Upload PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-postgres
          path: reports/pytest-postgres.xml
          if-no-files-found: warn
  hus_postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: ai07
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d ai07"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      HUS_DATABASE_URL: postgresql+psycopg2://test_user:ci_test_only@127.0.0.1:5432/ai07?sslmode=disable
      HUS_TEST_DATABASE_URL: postgresql+psycopg2://test_user:ci_test_only@127.0.0.1:5432/ai07?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -r requirements-dev.txt -c requirements-lock.txt
          python -m pip check
      - name: Migrate fresh HUS database
        run: python -m database.tools.migrate upgrade
      - name: Validate and publish checked-in source
        run: |
          python -m database.tools.publish_catalogs --dry-run
          python -m database.tools.publish_catalogs
      - name: HUS migration and repository integration
        run: python -m pytest -q -m hus_postgres --junitxml=reports/pytest-hus-postgres.xml
      - name: Upload HUS PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-hus-postgres
          path: reports/pytest-hus-postgres.xml
          if-no-files-found: warn
  rag_demo:
    # Keep the browser runner on the explicitly supported Ubuntu LTS image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          python -m pip install -r requirements-dev.txt -c requirements-lock.txt
          python -m pip check
      - run: python -m playwright install --with-deps chromium
      - run: node --test tests/frontend/chat.test.cjs
      - run: python -X utf8 -m tools.run_hus_rag_demo --smoke
      - name: Keep standalone RAG browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-demo-${{ github.sha }}
          path: backups/hus_rag_demo/
          if-no-files-found: warn
          retention-days: 14
