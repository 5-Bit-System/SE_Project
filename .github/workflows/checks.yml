name: Codebase checks
on: [push, pull_request]

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt -c requirements-lock.txt
      - run: python -m ruff check .
      - run: python -X utf8 tools/build_catalogs.py --check
      - run: python -m pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: se_project_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d se_project_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://test_user:ci_test_only@127.0.0.1:5432/se_project_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt -c requirements-lock.txt
      - run: python -m pytest -q
