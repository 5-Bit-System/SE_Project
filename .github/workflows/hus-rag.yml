name: Standalone HUS RAG

on:
  pull_request:
    paths:
      - 'app/hus/**'
      - 'app/schemas/hus.py'
      - 'app/services/hus_service.py'
      - 'app/static/hus-rag-demo.*'
      - 'app/static/favicon.svg'
      - 'data/hus/rag/**'
      - 'data/hus/citation_assets/**'
      - 'tools/run_hus_rag.py'
      - 'requirements-rag.txt'
      - 'requirements-lock.txt'
      - '.github/workflows/hus-rag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install standalone RAG dependencies
        run: python -m pip install -r requirements-rag.txt -c requirements-lock.txt
      - name: Check bundled data, API, citations and opt-in without provider or database
        run: python -X utf8 -m tools.run_hus_rag --check
