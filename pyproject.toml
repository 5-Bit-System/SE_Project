[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hus_postgres: requires an explicit HUS_TEST_DATABASE_URL for local ai07",
    "postgres: requires an explicitly configured TEST_DATABASE_URL",
    "full_catalog_acceptance: requires an explicit external --full-catalog-root",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["myproject", "my_project", "backups"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
